name: ClothChanger

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (Release | x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ClothChanger (Release | x64)
        run: msbuild "FF Cloth Changer\ClothChanger.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClothChanger-Release-x64
          path: |
            FF Cloth Changer/x64/Release/ClothChanger.exe
            FF Cloth Changer/x64/Release/*.pdb
          if-no-files-found: error
